<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with Safe Margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" />

  <!-- Checkerboard grid subtle backdrop -->
  <g opacity="0.08" fill="#ffffff">
    <rect x="96" y="96" width="80" height="80" />
    <rect x="256" y="96" width="80" height="80" />
    <rect x="176" y="176" width="80" height="80" />
    <rect x="336" y="176" width="80" height="80" />
    <rect x="96" y="256" width="80" height="80" />
    <rect x="256" y="256" width="80" height="80" />
    <rect x="176" y="336" width="80" height="80" />
    <rect x="336" y="336" width="80" height="80" />
  </g>

  <!-- Central Chess Pawn with GTA Streetwear Crown -->
  <!-- Pawn Head -->
  <circle cx="256" cy="180" r="56" fill="url(#gold)" filter="url(#glow)" />
  
  <!-- Crown on Pawn -->
  <path d="M 216 142 L 230 110 L 256 128 L 282 110 L 296 142 Z" fill="#ffffff" />
  
  <!-- Dark Sunglasses on Pawn -->
  <rect x="224" y="175" width="64" height="18" rx="6" fill="#09090b" />

  <!-- Pawn Collar -->
  <ellipse cx="256" cy="242" rx="72" ry="16" fill="url(#gold)" />

  <!-- Pawn Body & Base -->
  <path d="M 210 252 C 210 290 180 340 160 380 L 352 380 C 332 340 302 290 302 252 Z" fill="url(#gold)" />
  <rect x="144" y="380" width="224" height="34" rx="10" fill="url(#gold)" />

  <!-- GTA Style Typography: GT PAWN -->
  <text x="256" y="456" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    GT PAWN
  </text>
</svg>
